# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install github.com/dagger/dagger/modules/wolfi

[modules.engine-e2e]
source = ".dagger/modules/engine-e2e"

[modules.packager]
source = ".dagger/modules/packager"

[modules.dagger-dang-sdk]
source = "github.com/dagger/dang-sdk"

[modules.templates]
source = ".dagger/modules/templates"

[modules.java-sdk]
source = "."
check.skip = ["*"]

[sdks.java]
module = "java-sdk"

